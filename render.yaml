services:
  - type: web
    name: yangu-market-stores
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yangu-db
          property: connectionString

databases:
  - name: yangu-db
    plan: free
    databaseName: yangu
    user: yangu
