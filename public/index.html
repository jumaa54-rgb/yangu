<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yangu Market Stores – Bidhaa kwa bei yangu</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1d2b22;--mu:#66736b;--pr:#1b7a43;--ac:#f08a1c;--bd:#e4dfd2;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a15;--card:#1b261f;--tx:#eef3ee;--mu:#9fb0a5;--pr:#3fc079;--bd:#2c3b31}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:var(--tx);text-align:left;padding:0}
.logo b{display:block;font-size:18px;line-height:1.1}.logo i{display:block;font-size:12px;color:var(--ac);font-style:normal;font-weight:600}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button.p,.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}button.a{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--er);border-color:var(--er)}
main{max-width:1000px;margin:0 auto;padding:16px}
#bn{background:var(--ac);color:#fff;text-align:center;padding:8px 12px;font-weight:600}
.hero{background:linear-gradient(135deg,var(--pr),#0f5530);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:26px}.hero p{margin:0;opacity:.9}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
.bar input{flex:1;min-width:160px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer}
.card .em{font-size:44px;text-align:center;background:var(--bg);border-radius:10px;padding:10px}
.em img{width:100%;height:160px;object-fit:cover;border-radius:8px;display:block}
#mainpic img{height:280px;object-fit:contain}
.card h3{margin:10px 0 2px;font-size:16px}.pr{color:var(--pr);font-weight:700}.mu{color:var(--mu);font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#md.on{display:flex}#mb{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
#mb label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.er{color:var(--er);font-size:14px;min-height:18px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs .on{background:var(--pr);color:#fff}
</style></head><body>
<div id="bn" hidden></div>
<header>
 <button class="logo" data-act="home" aria-label="Yangu Market Stores home">
  <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1b7a43"/><path d="M16 24h32l-3 26a4 4 0 0 1-4 3H23a4 4 0 0 1-4-3z" fill="#fff"/><path d="M24 24v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#f08a1c" stroke-width="4" stroke-linecap="round"/><path d="M25 31l7 9 7-9M32 40v8" fill="none" stroke="#1b7a43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span><b>Yangu Market Stores</b><i>Bidhaa kwa bei yangu</i></span>
 </button>
 <nav id="nav"></nav>
</header>
<main id="app"><p class="mu">Loading…</p></main>
<div id="md"><div id="mb"></div></div>
<script src="/shim.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=e=>[...new TextEncoder().encode(e)].map(b=>b.toString(16).padStart(2,'0')).join('');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const val=id=>($('#'+id)?.value||'').trim(),setErr=t=>{const e=$('#er');if(e)e.textContent=t};
const QS=['What is your mother’s first name?','What was your first school?','What is your favourite food?','What town were you born in?'];
let db,user,me=null,admin=false,products=[],users=[],sortBy='new',formImgs=[],comments=[],view='home',cur=null,tab='users',q='',cat='',sub='',
 cfg={banner:'',cats:['Electronics','Fashion','Home','Food','Farm','Services','Other'],subs:{Electronics:['Phones','Laptops','TVs & Audio','Accessories'],Fashion:['Men','Women','Kids','Shoes'],Home:['Furniture','Kitchen','Decor','Appliances'],Food:['Fresh produce','Packaged food','Drinks','Bakery'],Farm:['Crops','Livestock','Tools & inputs'],Services:['Delivery','Repairs','Cleaning','Other services'],Other:[]}};
const base=()=>location.href.split('#')[0],U=()=>db.collection('users'),P=()=>db.collection('products');
const canEdit=p=>admin||(me&&me.email===p.email);
const pic=p=>p.imgId?`<img src="/_blob/${esc(p.imgId)}" alt="${esc(p.title)}">`:esc(p.em||'🛍️');
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};i.onerror=no;i.src=URL.createObjectURL(f)});
const SOC=['facebook','instagram','tiktok','whatsapp','x','youtube'];
const shr=(u,t)=>{const A1=encodeURIComponent(u),T=encodeURIComponent(t);return [['WhatsApp','https://wa.me/?text='+T+'%20'+A1],['Facebook','https://www.facebook.com/sharer/sharer.php?u='+A1],['X','https://twitter.com/intent/tweet?text='+T+'&url='+A1],['Telegram','https://t.me/share/url?url='+A1+'&text='+T]].map(([n,h])=>`<a class="btn" target="_blank" rel="noopener" href="${h}">${n}</a>`).join('')};
const social=()=>`<div class="box" style="margin-top:16px"><b>Follow and share Yangu Market</b><div class="row">${SOC.filter(k=>cfg.soc&&String(cfg.soc[k]||'').startsWith('https://')).map(k=>`<a class="btn p" target="_blank" rel="noopener" href="${esc(cfg.soc[k])}">${k[0].toUpperCase()+k.slice(1)}</a>`).join('')}</div><p class="mu" style="margin:10px 0 0">Share this site</p><div class="row" style="margin-top:4px">${shr(base(),'Yangu Market Stores – Bidhaa kwa bei yangu')}</div></div>`;
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n.startsWith('0')?'254'+n.slice(1):n};
const modal=h=>{$('#mb').style.maxWidth='';$('#mb').innerHTML=h;$('#md').classList.add('on')},closeM=()=>$('#md').classList.remove('on');
async function copy(t){try{await navigator.clipboard.writeText(t);alert('Link copied!')}catch(e){prompt('Copy this link:',t)}}

function render(){
 $('#bn').textContent=cfg.banner||'';$('#bn').hidden=!cfg.banner;
 $('#nav').innerHTML=(me?`<span class="mu">Hi, ${esc(me.name)}</span><button class="p" data-act="addp">+ Sell</button><button data-act="mine">My items</button>`:`<button data-act="login">Log in</button><button class="p" data-act="signup">Sign up</button>`)
  +(admin?'<button class="a" data-act="admin">Admin</button>':'')+'<button data-act="fb">💬 Feedback</button><button data-act="ai">✨ Ask AI</button><button data-act="share">Share site</button>'+(me?'<button data-act="logout">Log out</button>':'');
 const A=$('#app');
 if(!db){A.innerHTML='<div class="box">Live data is unavailable. Please open this site while signed in to Claude.</div>';return}
 if(view==='detail'){const p=products.find(x=>x.id===cur);
  A.innerHTML=!p?'<div class="box">This item is no longer available. <button data-act="home">Back</button></div>':
  `<button data-act="home">← Back</button><div class="box" style="margin-top:12px"><div class="card" style="cursor:default;border:0;padding:0"><div class="em" id="mainpic" data-act="zoom" data-i="0" style="cursor:zoom-in">${pic(p)}</div>${ids(p).length?'<p class="mu" style="margin:6px 0 0">Tap the photo to view it full size</p>':''}${ids(p).length>1?`<div class="row" style="margin-top:8px">${ids(p).map((i,n)=>`<img src="/_blob/${esc(i)}" data-act="gal" data-i="${n}" data-src="${esc(i)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer" alt="">`).join('')}</div>`:''}</div>
  <h2>${esc(p.title)}</h2><div class="pr">KSh ${Number(p.price).toLocaleString()}</div><p class="mu">${esc(p.cat)}${p.sub?' › '+esc(p.sub):''} · Seller: ${esc(p.sname)}</p><p>${esc(p.desc)}</p>
  <div class="row">${me?`<a class="btn p" target="_blank" rel="noopener" href="https://wa.me/${wa(p.phone)}?text=${encodeURIComponent('Hi, I am interested in '+p.title+' on Yangu Market Stores')}">WhatsApp seller</a>
  <a class="btn" href="tel:+${wa(p.phone)}">Call</a><a class="btn" href="mailto:${esc(p.email)}?subject=${encodeURIComponent(p.title)}">Email</a>`:'<button class="p" data-act="signup">Sign up to buy</button><button data-act="login">Log in</button><span class="mu">Create a free account to contact the seller.</span>'}
  <button data-act="sharep" data-id="${p.id}">Share link</button>${canEdit(p)?`<button data-act="editp" data-id="${p.id}">Edit</button>`:''}${admin?`<button class="d" data-act="delp" data-id="${p.id}">Delete</button>`:''}</div><p class="mu" style="margin-top:14px">Share on social media</p><div class="row" style="margin-top:4px">${shr(base()+'#p-'+p.id,p.title+' – KSh '+Number(p.price).toLocaleString()+' on Yangu Market Stores')}</div></div>`;return}
 if(view==='fb'){A.innerHTML=`<h2>Buyer and seller experiences</h2><div class="box">${me?`<label class="mu">Your experience, as ${esc(me.name)}</label><select id="fr"><option>Buyer</option><option>Seller</option></select><select id="fs" style="margin-top:8px"><option value="5">5 stars – Excellent</option><option value="4">4 stars – Good</option><option value="3">3 stars – Okay</option><option value="2">2 stars – Poor</option><option value="1">1 star – Bad</option></select><textarea id="ft" rows="3" maxlength="500" style="margin-top:8px" placeholder="Share your experience using Yangu Market Stores"></textarea><div class="er" id="er"></div><div class="row"><button class="p" data-act="postc">Post comment</button></div>`:'<p>Log in to share your experience.</p><div class="row"><button class="p" data-act="login">Log in</button><button data-act="signup">Sign up</button></div>'}</div>`+(comments.length?comments.map(c=>`<div class="box"><b>${esc(c.name)}</b> <span class="mu">· ${esc(c.role)} · ${[...Array(5)].map((_,i)=>i<c.stars?'★':'☆').join('')} · ${new Date(c.created).toLocaleDateString()}</span><p style="margin:6px 0 0">${esc(c.text)}</p>${admin?`<div class="row"><button class="d" data-act="delc" data-id="${c.id}">Remove</button></div>`:''}</div>`).join(''):'<div class="box mu">No comments yet. Be the first to share your experience.</div>');return}
 if(view==='admin'&&admin){
  A.innerHTML=`<h2>Admin panel</h2><div class="tabs">${['users','products','site'].map(t=>`<button class="${tab===t?'on':''}" data-act="tab" data-id="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`+
  (tab==='users'?`<div class="box sc"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td><button data-act="resetu" data-id="${u.id}">Reset password</button> <button class="d" data-act="delu" data-id="${u.id}">Remove</button></td></tr>`).join('')||'<tr><td>No users yet</td></tr>'}</table></div>`:
  tab==='products'?`<div class="box sc"><table>${products.map(p=>`<tr><td>${p.imgId?'🖼️':esc(p.em)} ${esc(p.title)}</td><td>KSh ${Number(p.price).toLocaleString()}</td><td>${esc(p.sname)}</td><td><select data-cat="${p.id}" aria-label="Category">${[...new Set([...cfg.cats,p.cat])].map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></td><td><button data-act="editp" data-id="${p.id}">Edit</button> <button class="d" data-act="delp" data-id="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td>No products yet</td></tr>'}</table></div>`:
  `<div class="box"><label>Site announcement banner (empty to remove)</label><input id="cb" value="${esc(cfg.banner)}"><label style="margin-top:10px;display:block">Categories (comma separated)</label><input id="cc" value="${esc(cfg.cats.join(', '))}"><label style="display:block;margin-top:10px">Subcategories (one line per category, like “Electronics: Phones, Laptops”)</label><textarea id="cs" rows="7">${esc(cfg.cats.map(c=>c+': '+(cfg.subs?.[c]||[]).join(', ')).join('\n'))}</textarea><p class="mu" style="margin:14px 0 0">Social media links (full https:// addresses; empty to remove)</p>${SOC.map(k=>`<label>${k}</label><input id="s_${k}" value="${esc(cfg.soc?.[k])}">`).join('')}<div class="row"><button class="p" data-act="savecfg">Save settings</button></div></div>`);return}
 let list=products;
 if(view==='mine')list=products.filter(p=>me&&p.email===me.email);
 list=list.filter(p=>(!cat||p.cat===cat)&&(!sub||p.sub===sub)&&(!q||(p.title+' '+p.desc).toLowerCase().includes(q.toLowerCase())));
 list=[...list].sort(({new:(a,b)=>b.created-a.created,old:(a,b)=>a.created-b.created,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,az:(a,b)=>String(a.title).localeCompare(String(b.title))})[sortBy]);
 A.innerHTML=(view==='home'?`<div class="hero"><h1>Bidhaa kwa bei yangu</h1><p>Buy and sell directly. Find what you need or list what you have.</p></div>`:'<h2>My items</h2>')+
 `<div class="bar"><input id="sq" placeholder="Search products…" value="${esc(q)}"><select id="sc"><option value="">All categories</option>${cfg.cats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select>${cat&&(cfg.subs?.[cat]||[]).length?`<select id="ss" aria-label="Subcategory"><option value="">All ${esc(cat)}</option>${cfg.subs[cat].map(s=>`<option ${s===sub?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}<select id="so" aria-label="Sort products">${[['new','Newest first'],['old','Oldest first'],['low','Price: low to high'],['high','Price: high to low'],['az','Name: A to Z']].map(([v,l])=>`<option value="${v}" ${v===sortBy?'selected':''}>${l}</option>`).join('')}</select></div>`+
 (list.length?`<div class="grid">${list.map(p=>`<div class="card" data-act="open" data-id="${p.id}"><div class="em">${pic(p)}</div><h3>${esc(p.title)}</h3><div class="pr">KSh ${Number(p.price).toLocaleString()}</div><div class="mu">${esc(p.cat)}${p.sub?' › '+esc(p.sub):''} · ${esc(p.sname)}</div></div>`).join('')}</div>`:'<div class="box mu">Nothing here yet. Log in and tap “+ Sell” to list the first product.</div>')+social();
 const s=$('#sq');if(s&&document.activeElement===document.body&&q){s.focus();s.setSelectionRange(q.length,q.length)}
}
const authForm=m=>modal(m==='login'?`<h3>Log in</h3><label>Email</label><input id="e" type="email"><label>Password</label><input id="pw" type="password"><div class="er" id="er"></div><div class="row"><button class="p" data-act="dologin">Log in</button><button data-act="forgot">Forgot password?</button><button data-act="signup">Create account</button></div>`:
 `<h3>Create account</h3><label>Full name</label><input id="n"><label>Email (one account per email)</label><input id="e" type="email"><label>Phone (for buyers to reach you)</label><input id="ph" placeholder="07xx xxx xxx"><label>Password (min 6)</label><input id="pw" type="password"><label>Recovery question</label><select id="q">${QS.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Answer</label><input id="qa"><div class="er" id="er"></div><div class="row"><button class="p" data-act="dosignup">Sign up</button><button data-act="login">I have an account</button></div>`);
const fillSub=cur=>{const s=$('#sb');if(!s)return;const l=cfg.subs?.[val('c')]||[];s.innerHTML='<option value="">None</option>'+[...new Set([...l,...(cur?[cur]:[])])].map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')};
const ids=p=>p?(p.imgIds||(p.imgId?[p.imgId]:[])):[];
const thumbs=()=>{const t=$('#ths');if(t)t.innerHTML=formImgs.map(i=>`<span style="position:relative;display:inline-block;margin:4px"><img src="/_blob/${esc(i)}" width="60" height="60" style="object-fit:cover;border-radius:8px" alt=""><button data-act="rmimg" data-id="${esc(i)}" style="position:absolute;top:-6px;right:-6px;padding:0 7px;border-radius:50%">×</button></span>`).join('')};
const prodForm=p=>{formImgs=ids(p);modal(`<h3>${p?'Edit':'Sell a'} product</h3><label>Title</label><input id="t" value="${esc(p?.title)}"><label>Price (KSh)</label><input id="pr" type="number" min="0" value="${esc(p?.price)}"><label>Category</label><select id="c">${[...new Set([...cfg.cats,...(p?.cat?[p.cat]:[])])].map(c=>`<option ${p?.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Subcategory</label><select id="sb"></select><label>Product photos (up to 10, you can pick several)</label><div id="ths"></div><input id="img" type="file" accept="image/*" multiple><label>Or take a photo with your camera (adds one)</label><input id="cam" type="file" accept="image/*" capture="environment"><label>Description</label><textarea id="d" rows="3">${esc(p?.desc)}</textarea><div class="row" style="margin-top:6px"><button data-act="aidesc">✨ Write with AI</button></div><div class="er" id="er"></div><div class="row"><button class="p" data-act="savep" data-id="${p?.id||''}">Save</button><button data-act="close">Cancel</button></div>`);thumbs();fillSub(p?.sub)};
const setMe=u=>{me=u;try{u?localStorage.setItem('ym_e',u.email):localStorage.removeItem('ym_e')}catch(e){}};
let zIds=[],zI=0;
const showZ=()=>{modal(`<div style="text-align:center"><img src="/_blob/${esc(zIds[zI])}" style="max-width:100%;max-height:70vh;object-fit:contain" alt=""><div class="row" style="justify-content:center;align-items:center">${zIds.length>1?`<button data-act="zprev">‹</button><span class="mu">${zI+1} / ${zIds.length}</span><button data-act="znext">›</button>`:''}<button data-act="close">Close</button></div></div>`);$('#mb').style.maxWidth='900px'};
const A={
 home(){view='home';q='';cat='';sub='';render()},close:closeM,login:()=>authForm('login'),signup:()=>authForm('signup'),
 open(t){cur=t.dataset.id;view='detail';render();scrollTo(0,0)},mine(){view='mine';render()},admin(){view='admin';render()},tab(t){tab=t.dataset.id;render()},
 share:()=>copy(base()),sharep:t=>copy(base()+'#p-'+t.dataset.id),logout(){setMe(null);view='home';render()},
 addp:()=>prodForm(),editp(t){prodForm(products.find(p=>p.id===t.dataset.id))},
 async dosignup(){const n=val('n'),e=val('e').toLowerCase(),ph=val('ph'),pw=$('#pw').value,qa=val('qa').toLowerCase();
  if(!n||!/^\S+@\S+\.\S+$/.test(e)||ph.replace(/\D/g,'').length<9||pw.length<6||!qa)return setErr('Fill all fields correctly (valid email, phone, 6+ char password).');
  try{const r=U().doc(hex(e));if((await r.get()).exists)return setErr('This email already has an account. Please log in.');
   const salt=crypto.randomUUID();await r.set({email:e,name:n,phone:ph,salt,hash:await sha(salt+pw),q:$('#q').value,qah:await sha(salt+qa),created:Date.now()});if(!(await r.get()).exists)throw 0;
   setMe({email:e,name:n,phone:ph});closeM();render()}catch(x){setErr('Could not sign up. Try again.')}},
 async dologin(){const e=val('e').toLowerCase(),pw=$('#pw').value;
  try{const s=await U().doc(hex(e)).get();if(!s.exists)return setErr('No account with that email.');const u=s.data();
   if(await sha(u.salt+pw)!==u.hash)return setErr('Wrong password.');setMe({email:u.email,name:u.name,phone:u.phone});closeM();render()}catch(x){setErr('Could not log in. Try again.')}},
 forgot:()=>modal(`<h3>Reset password</h3><label>Your email</label><input id="e" type="email"><div class="er" id="er"></div><div class="row"><button class="p" data-act="fstep">Continue</button></div>`),
 async fstep(){const e=val('e').toLowerCase();try{const s=await U().doc(hex(e)).get();if(!s.exists)return setErr('No account with that email.');
  modal(`<h3>Reset password</h3><p class="mu">${esc(s.data().q)}</p><input type="hidden" id="e" value="${esc(e)}"><label>Answer</label><input id="qa"><label>New password</label><input id="pw" type="password"><div class="er" id="er"></div><div class="row"><button class="p" data-act="fdone">Reset</button></div>`)}catch(x){setErr('Try again.')}},
 async fdone(){const e=val('e'),qa=val('qa').toLowerCase(),pw=$('#pw').value;if(pw.length<6)return setErr('Password must be 6+ characters.');
  try{const r=U().doc(hex(e)),u=(await r.get()).data();if(await sha(u.salt+qa)!==u.qah)return setErr('Wrong answer.');
   await r.update({hash:await sha(u.salt+pw)});modal('<h3>Password updated ✓</h3><div class="row"><button class="p" data-act="login">Log in</button></div>')}catch(x){setErr('Try again.')}},
 async savep(t){const title=val('t'),price=Number(val('pr'));if(!title||!(price>=0)||val('pr')==='')return setErr('Title and price are required.');
  const id=t.dataset.id||'p'+Date.now().toString(36),old=products.find(p=>p.id===id);
  let imgIds=[...formImgs];const fs=[...$('#img').files,...$('#cam').files];if(imgIds.length+fs.length>10)return setErr('Maximum 10 photos per product.');
  if(fs.length){setErr('Uploading photos…');try{const as=await claude.use('assets');if(!as)return setErr('Photo upload is not available right now.');for(const f of fs)imgIds.push((await as.upload(await shrink(f))).id)}catch(x){return setErr('Photo upload failed. Try another image.')}}
  setErr('Checking category…');let cat2=val('c'),sub2=val('sb');
  try{const s=await claude.use('sample');if(s&&cfg.cats.length>1){const r=await s.json(`Choose the single best category for this marketplace product from this list of categories and subcategories: ${JSON.stringify(cfg.cats.map(c=>({category:c,subcategories:cfg.subs?.[c]||[]})))}. Reply JSON only: {"category":"<exact category>","subcategory":"<exact subcategory of that category, or empty string>"}. Title: ${title}. Description: ${val('d')}`);if(cfg.cats.includes(r.category)&&r.category!==cat2&&confirm(`This looks like it belongs in "${r.category}", not "${cat2}". Move it to "${r.category}"?`))cat2=r.category;if(cat2!==val('c'))sub2=(cfg.subs?.[cat2]||[]).includes(r.subcategory)?r.subcategory:'';else if(!sub2&&(cfg.subs?.[cat2]||[]).includes(r.subcategory))sub2=r.subcategory}}catch(x){}
  setErr('');
  const d={title,price,cat:cat2,sub:sub2,em:'🛍️',imgId:imgIds[0]||'',imgIds,desc:val('d'),email:old?.email||me?.email||'admin',sname:old?.sname||me?.name||'Yangu Admin',phone:old?.phone||me?.phone||'',created:old?.created||Date.now()};
  try{await P().doc(id).set(d);if(!(await P().doc(id).get()).exists)throw 0;closeM()}catch(x){setErr('Could not save. Try again.')}},
 async delp(t){if(!admin)return;if(!confirm('Delete this product?'))return;try{await P().doc(t.dataset.id).delete();if(view==='detail'){view='home';render()}}catch(x){alert('Could not delete.')}},
 async delu(t){if(confirm('Remove this user?'))try{await U().doc(t.dataset.id).delete()}catch(x){alert('Failed')}},

 async delc(t){if(admin&&confirm('Remove this comment?'))try{await db.collection('comments').doc(t.dataset.id).delete()}catch(x){alert('Failed')}},
 ai:()=>modal(`<h3>✨ AI shopping assistant</h3><p class="mu">Tell me what you need and your budget.</p><textarea id="aq" rows="3" placeholder="e.g. a phone under KSh 15,000"></textarea><div class="row"><button class="p" data-act="aisend">Find products</button><button data-act="close">Close</button></div><div id="ao" style="margin-top:12px"></div>`),
 async aisend(){const m=val('aq');if(!m)return;const o=$('#ao');o.innerHTML='<span class="mu">Thinking…</span>';
  try{const s=await claude.use('sample');if(!s){o.textContent='AI is not available right now.';return}
   const list=products.slice(0,60).map(p=>({id:p.id,title:p.title,price:p.price,cat:p.cat,desc:(p.desc||'').slice(0,120)}));
   const r=await s.json(`You are the shopping assistant for Yangu Market Stores, a Kenyan marketplace (prices in KSh). Using ONLY the products listed below, help the buyer. Reply with JSON only: {"reply":"1-3 friendly sentences","ids":["ids of matching products, best first, max 5"]}. If nothing fits, say so and return an empty ids array.\nProducts: ${JSON.stringify(list)}\nBuyer request: ${m}`);
   const hits=(r.ids||[]).map(id=>products.find(p=>p.id===id)).filter(Boolean);
   o.innerHTML=`<p>${esc(r.reply)}</p>`+hits.map(p=>`<div class="card" style="margin-bottom:8px" data-act="aiopen" data-id="${p.id}"><b>${esc(p.title)}</b> <span class="pr">KSh ${Number(p.price).toLocaleString()}</span></div>`).join('')}catch(x){o.textContent='Sorry, the assistant could not answer. Try again.'}},
 aiopen(t){closeM();A.open(t)},
 async aidesc(t){const ti=val('t');if(!ti)return setErr('Enter a title first.');t.disabled=true;t.textContent='Writing…';

   $('#d').value=r.text.trim()}catch(x){setErr('AI could not write right now. Try again.')}finally{t.disabled=false;t.textContent='✨ Write with AI'}},
