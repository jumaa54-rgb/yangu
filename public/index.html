  try{const s=await claude.use('sample');if(s&&cfg.cats.length>1){const r=await s.json(`Choose the single best category for this marketplace product from this list of categories and subcategories: ${JSON.stringify(cfg.cats.map(c=>({category:c,subcategories:cfg.subs?.[c]||[]})))}. Reply JSON only: {"category":"<exact category>","subcategory":"<exact subcategory of that category, or empty string>"}. Title: ${title}. Description: ${val('d')}`);if(cfg.cats.includes(r.category)&&r.category!==cat2&&confirm(`This looks like it belongs in "${r.category}", not "${cat2}". Move it to "${r.category}"?`))cat2=r.category;if(cat2!==val('c'))sub2=(cfg.subs?.[cat2]||[]).includes(r.subcategory)?r.subcategory:'';else if(!sub2&&(cfg.subs?.[cat2]||[]).includes(r.subcategory))sub2=r.subcategory}}catch(x){}
  setErr('');
  const d={title,price,cat:cat2,sub:sub2,em:'🛍️',imgId:imgIds[0]||'',imgIds,desc:val('d'),locationText:val('locationText').slice(0,160),location:validListingLocation(listingLocation)?listingLocation:null,email:old?.email||me?.email||'admin',sname:old?.sname||me?.name||'Yangu Admin',phone:old?.phone||me?.phone||'',created:old?.created||Date.now()};
  try{await P().doc(id).set(d);if(!(await P().doc(id).get()).exists)throw 0;closeM()}catch(x){setErr('Could not save. Try again.')}},
 async delp(t){if(!admin)return;if(!confirm('Delete this product?'))return;try{await P().doc(t.dataset.id).delete();if(view==='detail'){view='home';render()}}catch(x){alert('Could not delete.')}},

 zoom(){const p=products.find(x=>x.id===cur);zIds=ids(p);if(!zIds.length)return;zI=+($('#mainpic').dataset.i||0);showZ()},

 gal(t){$('#mainpic').innerHTML='<img src="/_blob/'+t.dataset.src+'" alt="">';$('#mainpic').dataset.i=t.dataset.i},
 fb(){view='fb';render()},

  try{await db.collection('comments').doc('c'+Date.now().toString(36)).set({name:me.name,email:me.email,role:val('fr'),stars:Number(val('fs')),text:text.slice(0,500),created:Date.now()});$('#ft').value=''}catch(x){setErr('Could not post. Try again.')}},
 async delc(t){if(admin&&confirm('Remove this comment?'))try{await db.collection('comments').doc(t.dataset.id).delete()}catch(x){alert('Failed')}},
 ai:()=>modal(`<h3>✨ AI shopping assistant</h3><p class="mu">Tell me what you need and your budget.</p><textarea id="aq" rows="3" placeholder="e.g. a phone under KSh 15,000"></textarea><div class="row"><button class="p" data-act="aisend">Find products</button><button data-act="close">Close</button><button data-act="help">Contact help</button></div><div id="ao" style="margin-top:12px"></div>`),
 async aisend(){const m=val('aq');if(!m)return;const o=$('#ao');o.innerHTML='<span class="mu">Thinking…</span>';
  try{const s=await claude.use('sample');if(!s){o.textContent='AI is not available right now.';return}
   const list=products.slice(0,60).map(p=>({id:p.id,title:p.title,price:p.price,cat:p.cat,desc:(p.desc||'').slice(0,120)}));
   const r=await s.json(`You are the shopping assistant for Yangu Market Stores, a Kenyan marketplace (prices in KSh). Using ONLY the products listed below, help the buyer. Reply with JSON only: {"reply":"1-3 friendly sentences","ids":["ids of matching products, best first, max 5"]}. If nothing fits, say so and return an empty ids array.\nProducts: ${JSON.stringify(list)}\nBuyer request: ${m}`);
   const hits=(r.ids||[]).map(id=>products.find(p=>p.id===id)).filter(Boolean);
   o.innerHTML=`<p>${esc(r.reply)}</p>`+hits.map(p=>`<div class="card" style="margin-bottom:8px" data-act="aiopen" data-id="${p.id}"><b>${esc(p.title)}</b> <span class="pr">KSh ${Number(p.price).toLocaleString()}</span></div>`).join('')}catch(x){o.textContent='Sorry, the assistant could not answer. Try again.'}},
 aiopen(t){closeM();A.open(t)},
 async aidesc(t){const ti=val('t');if(!ti)return setErr('Enter a title first.');t.disabled=true;t.textContent='Writing…';
  try{const s=await claude.use('sample');if(!s){setErr('AI is not available right now.');return}
   const r=await s('Write a short, honest product description (2-3 sentences, under 60 words) for a Kenyan online marketplace listing. Plain text only, no emojis, do not invent specifications. Title: '+ti+'. Category: '+val('c')+'. Price: KSh '+val('pr')+'. Seller notes: '+val('d'),{cache:false});
   $('#d').value=r.text.trim()}catch(x){setErr('AI could not write right now. Try again.')}finally{t.disabled=false;t.textContent='✨ Write with AI'}},
 async savecfg(){try{await db.doc('site/config').set({banner:val('cb'),cats:val('cc').split(',').map(s=>s.trim()).filter(Boolean),subs:Object.fromEntries(val('cs').split('\n').map(l=>l.split(':')).filter(a=>a.length>=2&&a[0].trim()).map(a=>[a[0].trim(),a.slice(1).join(':').split(',').map(s=>s.trim()).filter(Boolean)])),soc:Object.fromEntries(SOC.map(k=>[k,val('s_'+k)]).filter(([k,v])=>v.startsWith('https://')))});alert('Saved')}catch(x){alert('Failed')}}
};

 route();
